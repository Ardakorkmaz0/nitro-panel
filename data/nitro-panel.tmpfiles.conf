# Let members of the linuwu_sense group change these without a password,
# the same way Linuwu-Sense opens up its own sysfs files.
z /sys/firmware/acpi/platform_profile 0664 root linuwu_sense -
# Linuwu-Sense leaves the keyboard light timeout root-only. Full paths, no
# globs: tmpfiles will not glob through the acer-wmi symlink. "z" skips the
# line whose folder this model does not have.
z /sys/module/linuwu_sense/drivers/platform:acer-wmi/acer-wmi/nitro_sense/backlight_timeout 0664 root linuwu_sense -
z /sys/module/linuwu_sense/drivers/platform:acer-wmi/acer-wmi/predator_sense/backlight_timeout 0664 root linuwu_sense -
